# Collects repossessed vehicles.
#
# Separate from the property collector and much less frequent: BAANKNET
# lists around 400 vehicles against roughly 72,000 properties, so a
# daily pass covers the whole set several times over.

name: Collect vehicles

on:
  schedule:
    - cron: "40 22 * * *"   # 04:10 IST
  workflow_dispatch:

concurrency:
  group: collect          # shares the group with the property crawl, so
  cancel-in-progress: false  # the two never run at the same time

jobs:
  vehicles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      CONTACT_URL: ${{ secrets.CONTACT_URL }}
      ENVIRONMENT: production
      ARCHIVE_ENABLED: "false"
      DB_SERVERLESS: "true"
      CRAWLER_DELAY_SECONDS: "3.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Crawl vehicles
        run: python -m auction_portal crawl baanknet_vehicle --limit 150
