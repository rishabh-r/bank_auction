# Production deployment: database, web portal, collector, reverse proxy.
#
# Four processes, deliberately separate:
#   postgres   the database
#   web        serves the portal; never does slow work
#   scheduler  crawls and maintains; never serves a request
#   caddy      TLS termination and the only public entry point
#
# Keeping web and scheduler apart means a long crawl cannot make the
# site slow, and restarting the site cannot interrupt a crawl.
#
#   docker compose up -d --build
#   docker compose run --rm web alembic upgrade head
#   docker compose logs -f scheduler
#
# See docs/ORACLE.md for a full walkthrough on a free Oracle Cloud
# machine, including the firewall rules Oracle applies by default.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auction_portal
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the other containers need it.
    expose:
      - "5432"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://auction:${POSTGRES_PASSWORD}@postgres:5432/auction_portal
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
      CONTACT_URL: ${CONTACT_URL:?set CONTACT_URL in .env}
      LOG_LEVEL: INFO
    volumes:
      - archive:/app/data
    # Not published to the host. Caddy is the only way in, so the app is
    # never reachable over plain HTTP by its port number.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      # A hostname for a certificate, e.g. 203.0.113.10.nip.io or your
      # own domain. Use ":80" to serve plain HTTP without one.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates; losing this means re-issuing
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://auction:${POSTGRES_PASSWORD}@postgres:5432/auction_portal
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
      CONTACT_URL: ${CONTACT_URL:?set CONTACT_URL in .env}
      CRAWLER_DELAY_SECONDS: "3.0"
      LOG_LEVEL: INFO
    volumes:
      - archive:/app/data
    command: ["python", "-m", "auction_portal", "schedule"]

volumes:
  pgdata:
  archive:
  caddy_data:
  caddy_config:
  caddy_logs:
